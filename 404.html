<!doctype html>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0b0d;color:#e9ecf1;font-family:'Fraunces',serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.box{max-width:640px;text-align:left;width:100%}
.code{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#e8c468;text-transform:uppercase;margin-bottom:24px}
h1{font-weight:300;font-size:clamp(56px,12vw,140px);letter-spacing:-.04em;line-height:.95;margin:0 0 24px;color:#e9ecf1}
h1 i{font-style:italic;color:#e8c468}
p{font-family:'JetBrains Mono',monospace;font-size:13px;color:#c2c8d4;letter-spacing:.04em;line-height:1.7;margin:0 0 32px;max-width:480px}
a{display:inline-flex;gap:10px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0a0b0d;background:#e8c468;padding:14px 22px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;transition:all .2s}
a:hover{background:#fff}
.line{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7a8290;letter-spacing:.18em;margin-top:48px;padding-top:24px;border-top:1px solid #2a3038;text-transform:uppercase}
</style>
</head>
<body>
<div class="box">
  <div class="code">ERR · 404 · OFF THE TAPE</div>
  <h1>Off <i>the tape.</i></h1>
  <p>This file isn't on the terminal. The link may be stale, the route may have shifted, or you may have wandered past the close of business.</p>

  <div class="line">FAA · TERMINAL · 2026</div>
</div>
</body>
